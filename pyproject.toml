[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-diagram"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.12.5",
    "PyYAML==6.0.1",
    "lxml==6.0.2",
    "typer==0.23.1",
    "mcp==1.26.0",
    "networkx==3.6.1",
    "httpx==0.28.1",
    "platformdirs==4.9.6",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "python-multipart>=0.0.12,<1",
]

[project.scripts]
cloud-diagram = "cloud_diagram.cli:main"
cloud-diagram-mcp = "cloud_diagram.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
